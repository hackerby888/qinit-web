name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Self-contained: the store / auth / collab units don't touch the sibling qinit monorepo, Mongo, or Redis
  # (the test preload pins the in-memory data layer), so this always runs and is the default required check.
  backend-tests:
    name: backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: test
        working-directory: backend
        run: bun test

  # Typechecks both packages + runs the frontend unit tests. These pull the sibling qinit monorepo (the dev
  # path ../../Qinit). Required on every PR — override the defaults with repo vars QINIT_REPO / QINIT_REF and,
  # if the sibling is private, a QINIT_PAT secret with read access.
  typecheck:
    name: typecheck + web tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout qinit-web
        uses: actions/checkout@v4
        with:
          path: Qinit-web

      - name: checkout qinit (sibling monorepo)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.QINIT_REPO || 'hackerby888/qinit' }}
          ref: ${{ vars.QINIT_REF }}
          token: ${{ secrets.QINIT_PAT || github.token }}
          path: Qinit

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install qinit (sibling)
        working-directory: Qinit
        run: bun install

      - name: install backend
        working-directory: Qinit-web/backend
        run: bun install --frozen-lockfile

      - name: install frontend
        working-directory: Qinit-web/frontend
        run: bun install --frozen-lockfile

      - name: typecheck backend
        working-directory: Qinit-web/backend
        run: bun run typecheck

      - name: typecheck frontend
        working-directory: Qinit-web/frontend
        run: bun run typecheck

      - name: frontend unit tests
        working-directory: Qinit-web/frontend
        run: bun test src/ide
