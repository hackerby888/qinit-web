name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Self-contained: the store / auth / collab units don't touch the sibling qinit monorepo, Mongo, or Redis
  # (the test preload pins the in-memory data layer), so this always runs and is the default required check.
  backend-tests:
    name: backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: test
        working-directory: backend
        run: bun test

  # Typechecks both packages, builds the IDE from sibling Qinit source, and runs the frontend unit tests.
  # Required on every PR — override the defaults with repo vars QINIT_REPO / QINIT_REF and, if the sibling is
  # private, a QINIT_PAT secret with read access. No core-lite checkout is part of this browser boundary.
  typecheck:
    name: typecheck + web tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout qinit-web
        uses: actions/checkout@v4
        with:
          path: Qinit-web

      - name: checkout qinit (sibling monorepo)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.QINIT_REPO || 'hackerby888/qinit' }}
          # the cheatcode branch this once pinned is merged and deleted; main carries the work now,
          # so an unset var follows it and QINIT_REF pins a sha when a qinit-side bump needs holding back.
          ref: ${{ vars.QINIT_REF || 'main' }}
          token: ${{ secrets.QINIT_PAT || github.token }}
          path: Qinit

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install qinit (sibling)
        working-directory: Qinit
        run: bun install

      - name: install backend
        working-directory: Qinit-web/backend
        run: bun install --frozen-lockfile

      - name: install frontend
        working-directory: Qinit-web/frontend
        run: bun install --frozen-lockfile

      - name: typecheck backend
        working-directory: Qinit-web/backend
        run: bun run typecheck

      - name: typecheck frontend
        working-directory: Qinit-web/frontend
        run: bun run typecheck

      - name: build frontend from sibling Qinit
        working-directory: Qinit-web/frontend
        run: bun run build

      - name: reject live core-lite compiler dependencies
        working-directory: Qinit-web/frontend
        run: |
          # match what the live loader's code carries, not the bare words: the docs name QINIT_CORE and show qubic-core-lite paths
          if grep -R -E 'env\.QINIT_CORE|cannot load live qpi\.h|not a core checkout|assembleQpiHeader|parseLiteAbiSource' dist; then
            echo "browser bundle contains a live core-lite dependency" >&2
            exit 1
          fi

      - name: reject dev-only debug code in the production bundle
        working-directory: Qinit-web/frontend
        run: |
          if grep -R -E '__crash|\[crash dev\]' dist; then
            echo "production bundle contains the DEV-only crash triggers (src/ide/crashDev.tsx)" >&2
            exit 1
          fi

      - name: frontend unit tests
        working-directory: Qinit-web/frontend
        run: bun run test
