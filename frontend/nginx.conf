# Serves the built SPA + reverse-proxies the API and the collab WebSocket to the backend container. Put a TLS
# terminator (Caddy/Traefik/your LB) in front of this for HTTPS — which also upgrades /collab to wss.
upstream api {
    server api:8787;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API + readiness probe → backend.
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /ready {
        proxy_pass http://api;
    }

    # Collab WebSocket (y-websocket) → backend, with the upgrade handshake.
    location /collab {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
