<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2EFE3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Set the theme before first paint (no flash). Honors saved choice, else OS.
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var t = q === "dark" || q === "light" ? q : localStorage.getItem("theme");
          var dark = t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0B0E0C");
          }
        } catch (e) {}
      })();
    </script>
    <title>qinit — Qubic contracts framework</title>
    <meta name="description" content="Framework and browser IDE for Qubic contracts: scaffold, build, test, deploy, as one standalone binary." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
